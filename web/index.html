<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工单关联矩阵演示</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f6fb; color: #172033; font-family: system-ui, "Noto Sans SC", sans-serif; }
    main { max-width: 920px; margin: 0 auto; padding: 64px 20px; }
    h1 { margin: 0 0 12px; font-size: clamp(28px, 5vw, 42px); }
    .lead { max-width: 720px; margin: 0 0 32px; color: #64748b; line-height: 1.8; }
    .demos { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
    .card { display: flex; flex-direction: column; padding: 24px; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 10px 35px rgb(25 52 91 / 8%); }
    .tag { align-self: flex-start; padding: 4px 9px; border-radius: 999px; background: #dbeafe; color: #1d4ed8; font-size: 13px; }
    h2 { margin: 18px 0 10px; font-size: 20px; }
    .card p { flex: 1; margin: 0 0 24px; color: #64748b; line-height: 1.7; }
    a { display: inline-block; padding: 11px 16px; border-radius: 10px; background: #2563eb; color: #fff; text-align: center; text-decoration: none; font-weight: 600; }
    a:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <main>
    <h1>工单关联矩阵</h1>
    <p class="lead">选择两个参数，查看它们在工单数据中的分布与联系。图表用于呈现可观察的关系，不直接判断因果。</p>
    <section class="demos" aria-label="演示列表">
      <article class="card">
        <span class="tag">趋势演示</span>
        <h2>最近 30 天 × 工单类别</h2>
        <p>观察不同类别的客服问题在时间上的出现频率和变化趋势。</p>
        <a href="./chart.html?demo=time-category">查看三维图表</a>
      </article>
      <article class="card">
        <span class="tag">关联演示</span>
        <h2>工单类别 × 优先级</h2>
        <p>比较不同业务类别与高、中、低优先级之间的数量分布。</p>
        <a href="./chart.html?demo=category-priority">查看三维图表</a>
      </article>
    </section>
  </main>
</body>
</html>
